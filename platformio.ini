[platformio]
src_dir = main
default_envs = ai_passport_badge

[env:ai_passport_badge]
platform = platformio/espressif32@6.13.0
platform_packages = platformio/framework-espidf@3.50503.0
framework = espidf
board = esp32-c3-devkitm-1
; The Passport has 8 MB Flash; the main application remains capped at 3 MB.
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DAI_PASSPORT_FIRMWARE_ROLE=\"badge\"
extra_scripts = pre:tools/embed_assets.py

[env:native]
platform = platformio/native@1.2.1
lib_deps = throwtheswitch/Unity@2.6.1
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
build_flags = -std=c11 -Wall -Wextra -Werror
extra_scripts = pre:tools/native_sources.py
